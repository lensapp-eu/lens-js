name: Release

# Publishes to npm via Trusted Publishing (OIDC) whenever a GitHub Release is
# published. No npm token is stored: npm verifies the workflow through OIDC.
on:
  release:
    types: [published]

permissions: {}

jobs:
  quality:
    uses: ./.github/workflows/code-quality.yml
    permissions:
      contents: read

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm publish
