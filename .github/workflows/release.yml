name: Publish to npm

# Publishes to npm via Trusted Publishing (OIDC) whenever a GitHub Release is
# published. No npm token is stored: npm verifies the workflow through OIDC.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm publish
